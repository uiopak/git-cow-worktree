name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [[ -n "$files" ]]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Test and vet
        shell: bash
        run: |
          git --version
          go vet ./...
          go test -count=1 ./...

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target:
          - windows-amd64
          - windows-arm64
          - windows-386
          - linux-amd64
          - linux-arm64
          - darwin-amd64
          - darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build archive and checksum
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo 'Release tags must use vMAJOR.MINOR.PATCH, with an optional prerelease suffix.'
              exit 1
            fi
            version=${GITHUB_REF_NAME#v}
          else
            version="dev-${GITHUB_SHA:0:7}"
          fi
          go run ./internal/release -version "$version" -target "$BUILD_TARGET" -output dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - name: Verify assets and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          archives=(dist/*.zip dist/*.tar.gz)
          if [[ ${#archives[@]} -ne 7 ]]; then
            echo 'Expected seven release archives.'
            exit 1
          fi
          cat dist/*.sha256 | sort -k2 > dist/checksums.txt
          (cd dist && sha256sum --check checksums.txt)
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [[ "$existing" == false ]]; then
            echo 'This release is already published; keeping its assets.'
            exit 0
          elif [[ "$existing" == true ]]; then
            gh release upload "$RELEASE_TAG" "${archives[@]}" dist/checksums.txt --clobber
          else
            gh release create "$RELEASE_TAG" "${archives[@]}" dist/checksums.txt \
              --verify-tag --draft --title "$RELEASE_TAG" --generate-notes \
              --notes-file .github/release-notes.md "${flags[@]}"
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
